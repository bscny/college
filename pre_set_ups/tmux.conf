set -g mouse on
set -g default-terminal "xterm-256color"
# enable copying to clipboard
set -s set-clipboard on
# List of plugins Look at repo for more details: https://github.com/tmux-plugins/tpm and https://github.com/tmux-plugins/tmux-yank
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# (<ctrl> + <B>) + <s> + <pane number> to swap the current pane with a target pane
bind-key s command-prompt -p "Swap with pane:" "swap-pane -t %%"
# press q to stop displaying pane number
bind-key Q display-panes \; display-message "Press Q again to clear pane numbers" \; refresh-client
set-option -g display-panes-time 100000

# (<ctrl> + <B>) + <-> to split 4 windows staight away
bind - split-window -v \; split-window -h \; select-pane -t 0 \; split-window -h \;

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
